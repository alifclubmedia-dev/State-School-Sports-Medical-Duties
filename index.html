<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>കേരള സ്കൂൾ കായികമേള 2026</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;500;600;700;800&family=Baloo+Chettan+2:wght@600;700;800&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet"><style id="km-css">/* Layout: stadium-lane concept — a torch-lit hero, then a dashboard, a lane-by-lane day schedule laid on a running-track timeline, a venue finder with map pins, and the medical desk. */
:root{
  --bg:#f1f3fa; --bg2:#e5e9f5; --paper:#ffffff; --glass:rgba(255,255,255,.74);
  --ink:#17204a; --head:#1d2a6b; --muted:#59618a; --line:rgba(23,32,74,.12);
  --flame:#f26522; --sun:#f5a70d; --mag:#c2185b; --teal:#0e9aab; --lime:#5aa62c; --blue:#2c5bd3; --navy:#1d2a6b; --track:#c9472f;
  --ok:#14915f; --live:#e5322d;
  --shadow:0 26px 54px -26px rgba(23,32,74,.42);
  --f-disp:'Baloo Chettan 2','Anek Malayalam','Noto Sans Malayalam',system-ui,sans-serif;
  --f-body:'Anek Malayalam','Noto Sans Malayalam',system-ui,sans-serif;
  --f-num:'Big Shoulders Display','Anek Malayalam',Impact,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0f27; --bg2:#121839; --paper:#161d45; --glass:rgba(22,29,69,.78);
  --ink:#eef1ff; --head:#e6eaff; --muted:#a4acd6; --line:rgba(238,241,255,.13);
  --flame:#ff7a3a; --sun:#ffbf3a; --mag:#ec4b8a; --teal:#2cc2d2; --lime:#86d04f; --blue:#6b8fff; --navy:#8fa0ff; --track:#e2654b;
  --ok:#3fcf8e; --live:#ff5a52;
  --shadow:0 26px 54px -24px rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0f27; --bg2:#121839; --paper:#161d45; --glass:rgba(22,29,69,.78);
  --ink:#eef1ff; --head:#e6eaff; --muted:#a4acd6; --line:rgba(238,241,255,.13);
  --flame:#ff7a3a; --sun:#ffbf3a; --mag:#ec4b8a; --teal:#2cc2d2; --lime:#86d04f; --blue:#6b8fff; --navy:#8fa0ff; --track:#e2654b;
  --ok:#3fcf8e; --live:#ff5a52;
  --shadow:0 26px 54px -24px rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow-x:hidden;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- ambient background ---------- */
.km-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/28px 28px,linear-gradient(165deg,var(--bg),var(--bg2))}
.km-bg .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:orb 24s ease-in-out infinite}
.km-bg .o1{width:44vmax;height:44vmax;background:radial-gradient(circle,color-mix(in srgb,var(--flame) 45%,transparent),transparent 65%);top:-16vmax;left:-14vmax}
.km-bg .o2{width:40vmax;height:40vmax;background:radial-gradient(circle,color-mix(in srgb,var(--teal) 40%,transparent),transparent 65%);bottom:-16vmax;right:-12vmax;animation-delay:-9s}
.km-bg .o3{width:28vmax;height:28vmax;background:radial-gradient(circle,color-mix(in srgb,var(--mag) 32%,transparent),transparent 65%);top:40%;left:58%;animation-delay:-15s}
.km-bg .lanes{position:absolute;left:-10%;right:-10%;bottom:-40vh;height:80vh;border-radius:50%;
  background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 46px,color-mix(in srgb,var(--track) 10%,transparent) 46px 48px);opacity:.8}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(5vw,4vh) scale(1.1)}66%{transform:translate(-4vw,6vh) scale(.92)}}
canvas#km-spark{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ---------- intro ---------- */
#km-intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,var(--paper),var(--bg2) 72%);transition:opacity .9s,visibility .9s}
#km-intro.hide{opacity:0;visibility:hidden}
#km-intro .in-wrap{display:grid;justify-items:center;gap:18px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#km-intro .logo-stack{width:min(56vw,300px)}
#km-intro p{font-family:var(--f-disp);font-weight:700;color:var(--head);font-size:clamp(1.05rem,2.6vw,1.35rem);margin:0;animation:rise 1s 1.9s both}
#km-intro small{font-size:.8rem;letter-spacing:.18em;color:var(--muted);animation:rise 1s 2.3s both}

/* ---------- layered logo ---------- */
.logo-stack{position:relative;aspect-ratio:700/947;max-width:100%}
.logo-stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.logo-stack .l-flame{transform-origin:35% 15.5%;animation:ignite .9s .15s cubic-bezier(.2,.9,.3,1.4) both,flicker 1.6s 1.1s ease-in-out infinite alternate;filter:drop-shadow(0 0 14px rgba(242,101,34,.55))}
.logo-stack .l-badge{transform-origin:15.6% 33.8%;animation:pop .8s .55s cubic-bezier(.2,.9,.3,1.6) both,beat 3.2s 2s ease-in-out infinite}
.logo-stack .l-text{animation:wipeDown 1.1s .8s cubic-bezier(.6,0,.2,1) both}
.logo-stack .l-fig{animation:wipeUp 1.3s .35s cubic-bezier(.6,0,.2,1) both,sway 6s 2.2s ease-in-out infinite}
.logo-stack .shine{position:absolute;inset:0;-webkit-mask:var(--logo-mask) center/contain no-repeat;mask:var(--logo-mask) center/contain no-repeat;
  background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%) 0 0/300% 100%;animation:shine 5.5s 2.4s ease-in-out infinite;pointer-events:none}
@keyframes ignite{0%{opacity:0;transform:scale(.2) translateY(30%)}100%{opacity:1;transform:none}}
@keyframes flicker{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(1.03,1.07) skewX(-2deg)}60%{transform:scale(.98,.96) skewX(2deg)}100%{transform:scale(1.02,1.05) skewX(-1deg)}}
@keyframes pop{0%{opacity:0;transform:scale(0) rotate(-40deg)}100%{opacity:1;transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes wipeDown{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes wipeUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes sway{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-5px)}}
@keyframes shine{0%,30%{background-position:120% 0}70%,100%{background-position:-120% 0}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.35}}

/* ---------- layout ---------- */
.wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding-block:18px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  padding:10px 14px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 12px 30px -22px rgba(0,0,0,.4)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.brand img{width:34px;height:46px;object-fit:contain}
.brand b{display:block;font-family:var(--f-disp);font-weight:800;color:var(--head);font-size:1.02rem;line-height:1.15}
.brand span{display:block;font-size:.78rem;color:var(--muted)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a,.nav button{font-size:.86rem;font-weight:600;color:var(--head);text-decoration:none;padding:7px 13px;border-radius:999px;background:transparent;border:1px solid var(--line);cursor:pointer;transition:.25s}
.nav a:hover,.nav button:hover{background:color-mix(in srgb,var(--sun) 25%,transparent);transform:translateY(-1px)}
.nav .adm{background:var(--head);color:var(--paper);border-color:var(--head)}
.nav .adm.on{background:var(--live);border-color:var(--live);color:#fff}

.ticker{margin-top:12px;display:flex;align-items:center;gap:10px;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,var(--flame),var(--mag));color:#fff}
.ticker b{flex:none;padding:8px 12px;background:rgba(0,0,0,.22);font-size:.8rem;letter-spacing:.05em}
.ticker .tk{flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.ticker .tk span{display:inline-block;padding-left:100%;animation:tick 26s linear infinite;font-weight:600;font-size:.92rem}
@keyframes tick{to{transform:translateX(-100%)}}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;align-items:center;margin-top:24px}
.stage{position:relative;perspective:1300px;padding:30px 18px}
.logo-card{position:relative;margin:0 auto;width:min(380px,100%);background:var(--paper);border-radius:40px;padding:28px 30px;
  box-shadow:0 50px 90px -34px rgba(23,32,74,.5),0 0 0 1px var(--line);transform-style:preserve-3d;transition:transform .25s ease-out}
.logo-card::before{content:"";position:absolute;inset:-14px;border-radius:52px;z-index:-1;
  background:conic-gradient(from 0deg,var(--flame),var(--sun),var(--lime),var(--teal),var(--blue),var(--mag),var(--flame));filter:blur(18px);opacity:.55;animation:spin 14s linear infinite}
.logo-card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,30%),color-mix(in srgb,var(--sun) 22%,transparent),transparent 45%)}
.logo-card .logo-stack{transform:translateZ(60px)}
:root[data-theme="dark"] .logo-card,.logo-card{background:#fff}
.pill{position:absolute;z-index:3;font-family:var(--f-disp);font-weight:800;font-size:clamp(.78rem,1.6vw,.95rem);line-height:1.1;padding:10px 15px;border-radius:16px;color:#fff;box-shadow:0 14px 28px -12px rgba(0,0,0,.45);transition:translate .3s}
.pill small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78em;opacity:.9}
.pill.p1{top:4px;left:0;background:var(--flame);transform:rotate(-7deg);animation:pf 7s ease-in-out infinite}
.pill.p2{top:18%;right:0;background:var(--blue);transform:rotate(5deg);animation:pf 8s ease-in-out infinite reverse}
.pill.p3{bottom:10%;right:2%;background:var(--teal);transform:rotate(-4deg);animation:pf 9s ease-in-out infinite}
.pill.p4{bottom:2%;left:4%;background:var(--mag);transform:rotate(4deg);animation:pf 7.5s ease-in-out infinite reverse}
@keyframes pf{0%,100%{margin-top:0}50%{margin-top:-10px}}

.hero-text{animation:rise 1s .2s both}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--head);background:var(--glass);border:1px solid var(--line);padding:7px 14px;border-radius:999px}
.kicker i{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 10px var(--live);animation:pulse 1.5s infinite}
.hero h1{font-family:var(--f-disp);font-weight:800;color:var(--head);font-size:clamp(2.3rem,6.4vw,4.1rem);line-height:1.02;margin-top:14px;letter-spacing:-.01em}
.hero h1 .ed{display:inline-block;font-size:.5em;vertical-align:.55em;background:linear-gradient(135deg,var(--flame),var(--mag));color:#fff;padding:2px 14px 0;border-radius:999px;margin-right:8px}
.hero h1 .grad{background:linear-gradient(90deg,var(--flame),var(--mag),var(--blue),var(--teal),var(--flame));background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shineTxt 9s linear infinite}
@keyframes shineTxt{to{background-position:300% center}}
.hero .lede{color:var(--muted);font-size:1.02rem;margin:12px 0 0;max-width:52ch}
.datebig{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.datebig span{font-weight:700;color:var(--head);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.92rem}

.countdown{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;perspective:600px}
.cd{width:76px;text-align:center}
.cd .tile{position:relative;height:72px;border-radius:16px;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-weight:800;font-size:2.4rem;
  background:linear-gradient(180deg,#2a3a8f,#151d4f);box-shadow:0 14px 26px -10px rgba(21,29,79,.6),inset 0 1px 0 rgba(255,255,255,.2);overflow:hidden}
.cd .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.4)}
.cd .tile.flip span{animation:flipNum .5s cubic-bezier(.3,.7,.3,1.2)}
@keyframes flipNum{from{transform:rotateX(-90deg);opacity:.2}to{transform:none;opacity:1}}
.cd i{display:block;font-style:normal;font-size:.8rem;color:var(--muted);margin-top:5px;font-weight:600}
.cd-label{margin-top:8px;font-size:.92rem;color:var(--muted)}
.cd-label b{color:var(--head)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.cta{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:700;text-decoration:none;cursor:pointer;border:0;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.2,.9,.25,1.4)}
.cta.pri{background:linear-gradient(135deg,var(--flame),var(--mag));color:#fff;box-shadow:0 16px 30px -12px color-mix(in srgb,var(--flame) 70%,transparent)}
.cta.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%) 0 0/250% 100%;animation:shine 3.6s ease-in-out infinite}
.cta.sec{background:var(--paper);color:var(--head);border:1.5px solid var(--line)}
.cta:hover{transform:translateY(-3px) scale(1.03)}

/* ---------- section heads ---------- */
.sh{margin:80px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sh small{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.08em;color:var(--flame)}
.sh h2{font-family:var(--f-disp);font-weight:800;color:var(--head);font-size:clamp(1.8rem,4.4vw,2.7rem);line-height:1.05;margin-top:2px}
.sh h2 .en{display:block;font-family:var(--f-body);font-weight:500;font-size:.42em;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.sh p{max-width:44ch;color:var(--muted);margin:0}

/* ---------- dashboard ---------- */
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;perspective:1200px}
.stat{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px;background:var(--paper);box-shadow:var(--shadow);border:1px solid var(--line);transform-style:preserve-3d;transition:transform .2s ease-out}
.stat .bgN{position:absolute;right:-4px;bottom:-30px;font-family:var(--f-num);font-weight:800;font-size:7.4rem;line-height:1;color:var(--c);opacity:.09}
.stat .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--c) 16%,transparent);transform:translateZ(36px)}
.stat .n{font-family:var(--f-num);font-weight:800;font-size:3.1rem;line-height:1;margin-top:12px;color:var(--c);transform:translateZ(54px)}
.stat .l{font-weight:700;margin-top:6px;color:var(--head)}
.stat .s{font-size:.86rem;color:var(--muted)}
.dash2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-top:16px}
.panel{border-radius:26px;padding:22px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.panel h3{font-family:var(--f-disp);font-weight:800;font-size:1.15rem;color:var(--head);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h3 span{font-family:var(--f-body);font-weight:500;font-size:.82rem;color:var(--muted)}
.bar-row{display:grid;grid-template-columns:92px 1fr 40px;gap:12px;align-items:center;margin:12px 0;cursor:pointer}
.bar-row .bl b{display:block;color:var(--head);font-size:.95rem}
.bar-row .bl span{font-size:.78rem;color:var(--muted)}
.bar{height:16px;border-radius:999px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;transition:width 1.6s cubic-bezier(.2,.9,.25,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:barShine 2.6s infinite}
@keyframes barShine{to{transform:translateX(100%)}}
.bar-row .bv{text-align:right;font-family:var(--f-num);font-weight:800;font-size:1.25rem;color:var(--head)}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.donut{width:150px;height:150px;flex:none}
.donut circle{fill:none;stroke-width:22;transition:stroke-dasharray 1.4s cubic-bezier(.2,.9,.25,1),opacity .3s;cursor:pointer}
.donut text{fill:var(--head)}
.donut .sub{fill:var(--muted)}
.cats{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.cat{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent;background:none;text-align:left;transition:.2s}
.cat:hover,.cat.on{background:var(--bg2);border-color:var(--line)}
.cat .sw{width:12px;height:12px;border-radius:4px;flex:none}
.cat .nm{flex:1}
.now-box{margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 30%,var(--paper)),var(--paper));border:1px solid var(--line);display:flex;gap:12px;align-items:center;cursor:pointer}
.now-box .em{font-size:1.9rem}
.now-box .k{font-size:.76rem;font-weight:700;color:var(--flame)}
.now-box .t{font-weight:700;color:var(--head)}
.now-box .s{font-size:.84rem;color:var(--muted)}

/* calendar grid (official chart) */
.calwrap{margin-top:16px}
.cal-scroll{overflow-x:auto;border-radius:18px;border:1px solid var(--line);background:var(--paper)}
table.cal{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:.88rem}
table.cal th,table.cal td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.cal thead th{position:sticky;top:0;background:var(--paper);font-weight:700;color:var(--head);cursor:pointer}
table.cal thead th.today{color:var(--flame)}
table.cal th .d{display:block;font-family:var(--f-num);font-weight:800;font-size:1.25rem;line-height:1}
table.cal th .w{display:block;font-size:.72rem;color:var(--muted);font-weight:500}
table.cal td.ev{text-align:left;white-space:normal;min-width:190px}
table.cal td.ev b{color:var(--head)}
table.cal td.ev small{display:block;color:var(--muted);font-size:.78rem}
table.cal td.vn{text-align:left;white-space:normal;color:var(--muted);font-size:.8rem;min-width:130px}
table.cal tbody tr{cursor:pointer;transition:background .2s}
table.cal tbody tr:hover{background:var(--bg2)}
table.cal td.c{padding:5px 3px}
table.cal td.c i{display:block;height:26px;border-radius:8px;transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.9,.25,1.1)}
.cal-in table.cal td.c i{transform:scaleX(1)}

/* ---------- days ---------- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;perspective:1300px}
.day{position:relative;overflow:hidden;border:0;cursor:pointer;text-align:left;color:#fff;border-radius:24px;padding:16px 14px 14px;min-height:170px;background:var(--grad);
  box-shadow:0 24px 40px -22px var(--sh);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.9,.25,1.2),filter .4s,box-shadow .4s;filter:saturate(.8) brightness(.95)}
.day::after{content:attr(data-n);position:absolute;right:-6px;bottom:-26px;font-family:var(--f-num);font-weight:800;font-size:7rem;line-height:1;color:rgba(255,255,255,.14)}
.day::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.07) 22px 24px);pointer-events:none}
.day.active{filter:none;transform:translateY(-10px) rotateX(6deg) scale(1.04);box-shadow:0 40px 60px -22px var(--sh)}
.day>*{position:relative;z-index:1}
.day .ln{font-size:.74rem;font-weight:700;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:999px;display:inline-block}
.day .dd{font-family:var(--f-num);font-weight:800;font-size:3.1rem;line-height:.95;margin-top:10px;text-shadow:2px 3px 0 rgba(0,0,0,.18)}
.day .mm{font-weight:700;font-size:.92rem;line-height:1.2}
.day .cnt{margin-top:10px;font-size:.78rem;display:flex;gap:6px;flex-wrap:wrap}
.day .cnt span{background:rgba(0,0,0,.2);padding:3px 8px;border-radius:999px}
.day .live{position:absolute;top:14px;right:12px;font-size:.66rem;font-weight:800;background:#fff;color:#d62828;padding:3px 8px;border-radius:999px;animation:pulse 1.6s infinite;display:none}
.day .live.show{display:block}

.tl-head{margin-top:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.tl-head h3{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.45rem,3.6vw,2.1rem);color:var(--head);line-height:1.1}
.tl-head h3 span{display:block;font-family:var(--f-body);font-size:.55em;font-weight:500;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipbtn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--head);transition:.2s}
.chipbtn.on{background:var(--head);color:var(--paper);border-color:var(--head)}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-width:0}
.search input{border:0;outline:0;background:none;min-width:0;width:200px;max-width:52vw}
.timeline{position:relative;margin-top:22px;padding-left:46px;perspective:1600px}
.timeline .track{position:absolute;left:12px;top:6px;bottom:6px;width:14px;border-radius:8px;background:var(--track);overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.timeline .track::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 3px,rgba(255,255,255,.75) 3px 4px,transparent 4px 10px,rgba(255,255,255,.75) 10px 11px,transparent 11px)}
.timeline .track i{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent 30%);transform-origin:top;animation:grow 1.3s cubic-bezier(.2,.9,.25,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.ev{position:relative;margin-bottom:16px;animation:evIn .85s cubic-bezier(.2,.9,.25,1.15) both;transform-origin:left center}
@keyframes evIn{from{opacity:0;transform:rotateY(-50deg) translateX(-50px) translateZ(-100px)}to{opacity:1;transform:none}}
.ev .node{position:absolute;left:-41px;top:28px;width:24px;height:24px;border-radius:50%;background:var(--paper);border:4px solid var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--paper) 75%,transparent)}
.ev.live .node{background:var(--c);animation:pulse 1.4s infinite}
.card{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 20px;border-radius:24px;background:var(--paper);border:1px solid var(--line);
  box-shadow:0 22px 44px -26px rgba(23,32,74,.5);transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .3s;cursor:pointer;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(380px circle at var(--mx,0%) var(--my,0%),color-mix(in srgb,var(--c) 14%,transparent),transparent 50%)}
.card::after{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 6px 6px 0;background:var(--c)}
.emo{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;background:color-mix(in srgb,var(--c) 15%,var(--paper));transform:translateZ(46px);transition:transform .5s cubic-bezier(.2,.9,.25,1.6)}
.card:hover .emo{transform:translateZ(46px) rotate(-10deg) scale(1.1)}
.cbody{min-width:0;transform:translateZ(26px)}
.ev-time{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.85rem;font-weight:700;color:var(--c)}
.ev-title{font-family:var(--f-disp);font-weight:800;font-size:1.3rem;color:var(--head);line-height:1.2;margin-top:2px}
.ev-title small{font-family:var(--f-body);font-weight:500;font-size:.66em;color:var(--muted);margin-left:6px}
.ev-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ev-meta span{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.ev-venue{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:.88rem;color:var(--muted)}
.ev-venue a{font-weight:700;text-decoration:none}
.avs{display:flex;align-items:center}
.av{width:32px;height:32px;border-radius:50%;border:3px solid var(--paper);margin-left:-8px;background:var(--bg2) center/cover;display:grid;place-items:center;font-size:.72rem;font-weight:800;color:#fff}
.avs .av:first-child{margin-left:0}
.avs small{margin-left:8px;font-size:.78rem;color:var(--muted)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;transform:translateZ(36px)}
.tag{font-size:.74rem;font-weight:700;color:#fff;background:var(--c);padding:5px 11px;border-radius:999px;white-space:nowrap}
.more{font-size:.8rem;font-weight:700;color:var(--head);padding:7px 13px;border-radius:999px;background:color-mix(in srgb,var(--sun) 32%,var(--paper));white-space:nowrap}
.status{font-size:.68rem;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.03em}
.status.live{background:var(--live);color:#fff}.status.next{background:var(--sun);color:#3d2700}.status.done{background:var(--bg2);color:var(--muted)}
.tbc{font-size:.7rem;font-weight:700;color:var(--muted);border:1px dashed var(--muted);padding:2px 8px;border-radius:999px}
.empty{padding:26px;border-radius:22px;border:1.5px dashed var(--line);color:var(--muted);text-align:center;background:var(--glass)}
.empty b{display:block;color:var(--head);font-family:var(--f-disp);font-size:1.15rem}

/* ---------- venues ---------- */
.vhero{position:relative;border-radius:30px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;padding:22px;color:#fff;box-shadow:var(--shadow);background:#1d2a6b center/cover}
.vhero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,14,40,.05),rgba(10,14,40,.82))}
.vhero>*{position:relative}
.vhero h3{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.4rem,3.6vw,2rem);line-height:1.1}
.vhero p{margin:6px 0 0;opacity:.9;max-width:60ch}
.vfind{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:16px}
.mapbox{border-radius:26px;overflow:hidden;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .cap{position:absolute;left:12px;bottom:10px;font-size:.74rem;color:var(--muted);background:var(--glass);padding:4px 10px;border-radius:999px}
.pin{cursor:pointer}
.pin .ring{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
.pin.dim{opacity:.18}
.pin.hl .ring{animation-duration:1s}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.vlist{display:grid;gap:10px;max-height:560px;overflow:auto;padding-right:4px;min-width:0}
.vcard{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px;border-radius:20px;background:var(--paper);border:1px solid var(--line);cursor:pointer;transition:transform .25s,box-shadow .25s;text-align:left;min-width:0}
.vcard:hover{transform:translateX(4px);box-shadow:0 18px 30px -20px rgba(23,32,74,.55)}
.vcard .vn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-weight:800;font-size:1.3rem;background:var(--c)}
.vcard h4{font-family:var(--f-disp);font-weight:800;font-size:1.04rem;color:var(--head);line-height:1.2}
.vcard .pl{font-size:.82rem;color:var(--muted)}
.vcard .sp{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.vcard .sp span{font-size:.76rem;padding:3px 8px;border-radius:999px;background:var(--bg2)}
.vcard .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
.lnk{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:999px;text-decoration:none;background:var(--head);color:var(--paper);border:0;cursor:pointer}
.lnk.alt{background:var(--bg2);color:var(--head)}

/* ---------- medical ---------- */
.help{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hcard{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:20px;background:var(--paper);border:1px solid var(--line)}
.hcard .hi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:color-mix(in srgb,var(--c) 16%,transparent)}
.hcard b{display:block;color:var(--head)}
.hcard .ph{font-family:var(--f-num);font-weight:700;font-size:1.25rem;letter-spacing:.02em;user-select:all}
.med{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:14px}
.mcard{border-radius:24px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.mcard .mh{display:flex;gap:10px;align-items:center;padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--paper)),var(--paper));border-bottom:1px solid var(--line);cursor:pointer}
.mcard .mh b{font-family:var(--f-disp);font-weight:800;color:var(--head);line-height:1.2}
.mcard .mh small{display:block;color:var(--muted);font-size:.8rem}
.mcard .mh .cnt{margin-left:auto;font-family:var(--f-num);font-weight:800;font-size:1.4rem;color:var(--c)}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pa{width:42px;height:42px;border-radius:50%;background:var(--bg2) center/cover;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.prow b{display:block;color:var(--head);line-height:1.2}
.prow small{color:var(--muted);font-size:.8rem}
.prow .pp{font-family:var(--f-num);font-weight:700;font-size:1.02rem;user-select:all;text-align:right}
.copy{border:1px solid var(--line);background:var(--bg2);border-radius:999px;font-size:.72rem;padding:3px 9px;cursor:pointer;margin-left:6px}
.mnone{padding:16px;color:var(--muted);font-size:.9rem}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(9,12,34,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.35s;perspective:1500px;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal.open{opacity:1;visibility:visible}
.sheet{position:relative;width:min(880px,100%);max-height:100%;overflow:auto;border-radius:30px;background:var(--paper);box-shadow:0 60px 120px -30px rgba(0,0,0,.6);
  transform:rotateX(22deg) translateY(70px) scale(.88);opacity:0;transition:transform .65s cubic-bezier(.2,.9,.25,1.15),opacity .45s}
.modal.open .sheet{transform:none;opacity:1}
.m-hero{position:relative;padding:30px 28px 26px;color:#fff;background:var(--mg);overflow:hidden}
.m-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% -10%,rgba(255,255,255,.35),transparent 45%),repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.06) 30px 32px)}
.m-hero.photo{background:#1d2a6b center/cover;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end}
.m-hero.photo::before{background:linear-gradient(180deg,rgba(10,14,40,.1),rgba(10,14,40,.85))}
.m-hero>*{position:relative}
.m-hero .big{position:absolute;right:18px;bottom:-26px;font-size:8.4rem;opacity:.22;animation:sway 5s ease-in-out infinite}
.m-hero .meta{display:flex;gap:7px;flex-wrap:wrap;font-size:.8rem;font-weight:700}
.m-hero .meta span{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:999px}
.m-hero h3{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.6rem,4.4vw,2.3rem);line-height:1.1;margin-top:14px;max-width:88%}
.m-hero h4{font-weight:500;font-size:1rem;opacity:.92;margin-top:4px}
.mclose{position:absolute;top:14px;right:14px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:#1d2a6b;font-size:1.2rem;cursor:pointer;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);transition:transform .4s}
.mclose:hover{transform:rotate(90deg)}
.m-body{padding:22px 28px 28px}
.m-body h5{font-size:.8rem;letter-spacing:.06em;color:var(--flame);font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.m-body h5:first-child{margin-top:0}
.hl{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.hl div{padding:12px 14px;border-radius:16px;background:var(--bg2);animation:rise .55s both}
.hl small{display:block;color:var(--muted);font-size:.76rem}
.hl b{color:var(--head)}
.vbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:18px;border:1px solid var(--line)}
.vbox .vb{flex:1;min-width:200px}
.vbox b{display:block;font-family:var(--f-disp);font-weight:800;color:var(--head);font-size:1.08rem}
.vbox small{color:var(--muted)}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;perspective:900px}
.person{text-align:center;padding:16px 10px;border-radius:20px;background:linear-gradient(180deg,var(--paper),var(--bg2));border:1px solid var(--line);animation:rise .55s both;transition:transform .4s cubic-bezier(.2,.9,.25,1.4)}
.person:hover{transform:translateY(-5px) rotateY(8deg)}
.pring{width:92px;height:92px;border-radius:50%;margin:0 auto;padding:4px;background:conic-gradient(var(--flame),var(--sun),var(--teal),var(--blue),var(--mag),var(--flame));animation:spin 10s linear infinite}
.pring>div{width:100%;height:100%;border-radius:50%;background:var(--bg2) center/cover;display:grid;place-items:center;animation:spin 10s linear infinite reverse;color:#fff;font-weight:800;font-size:1.3rem}

.person small{display:block;color:var(--muted);font-size:.8rem}
.person .pp{font-family:var(--f-num);font-weight:700;margin-top:4px;user-select:all}
.daystrip{display:flex;gap:6px;flex-wrap:wrap}
.daystrip span{min-width:52px;text-align:center;padding:6px 8px;border-radius:12px;background:var(--bg2);color:var(--muted);font-size:.78rem;line-height:1.1}
.daystrip span b{display:block;font-family:var(--f-num);font-size:1.15rem;color:inherit}
.daystrip span.on{background:var(--c);color:#fff}
.vevs{display:grid;gap:8px}
.vev{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--bg2);cursor:pointer;border:0;text-align:left;width:100%}
.vev .e{font-size:1.4rem}
.vev b{color:var(--head)}
.vev small{display:block;color:var(--muted)}
.m-nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:16px;border-top:1px dashed var(--line);flex-wrap:wrap}
.m-nav button{border:0;background:var(--bg2);padding:9px 15px;border-radius:999px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--head)}
.m-nav button:disabled{opacity:.35;cursor:default}
.m-nav .edit{background:var(--live);color:#fff}

/* ---------- footer ---------- */
footer{margin-top:90px;border-radius:36px;background:#141c4a;color:#e8ebff;padding:34px 28px;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(242,101,34,.35),transparent 65%);top:-170px;right:-120px;animation:orb 16s ease-in-out infinite}
.fg{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center}
.fg .fl{background:#fff;border-radius:22px;padding:14px 18px;width:150px;box-sizing:border-box}.fg .fl img{width:100%;max-width:100%;display:block}
.fg h4{font-family:var(--f-disp);font-weight:800;font-size:1.5rem}
.fg p{margin:4px 0 0;opacity:.85}
.fg ul{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.fg a{color:#ffcf6b;font-weight:700}
.credit{display:flex;align-items:center;gap:12px;max-width:260px}
.credit img{width:74px;height:74px;border-radius:50%;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.15)}

.copyl{position:relative;margin-top:22px;padding-top:16px;border-top:1px solid rgba(255,255,255,.15);font-size:.82rem;opacity:.75;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- admin ---------- */
.adminbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;
  padding:10px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.adminbar .ab{pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:#141c4a;color:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 20px 40px -14px rgba(0,0,0,.55);max-width:100%;animation:rise .5s both}
.adminbar .st{font-size:.84rem;padding:0 6px}
.adminbar .st b{color:#ffcf6b}
.abtn{border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:.84rem;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}
.abtn.go{background:linear-gradient(135deg,#f26522,#c2185b)}

.ed .sheet{width:min(760px,100%)}
.ed .m-hero{--mg:linear-gradient(135deg,#1d2a6b,#2c5bd3)}
.form{display:grid;gap:12px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld{display:grid;gap:5px;min-width:0}
.fld>span{font-size:.8rem;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.fld textarea{min-height:76px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--blue)}
.dpick{display:flex;flex-wrap:wrap;gap:6px}
.dpick label{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;border:1.5px solid var(--line);cursor:pointer;font-size:.86rem}

.chk{display:flex;align-items:center;gap:8px;font-size:.9rem}
.plist{display:grid;gap:10px}
.prow-ed{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);animation:rise .35s both}
.pe-ph{display:grid;justify-items:center;gap:6px;width:96px}
.pe-ph .ph-up{width:84px;height:84px;font-size:.75rem;box-shadow:0 0 0 3px var(--paper),0 0 0 5px color-mix(in srgb,var(--flame) 60%,transparent)}
.pe-phb{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.pe-phb button{border:0;border-radius:999px;padding:4px 9px;font-size:.72rem;font-weight:700;cursor:pointer;background:var(--paper);color:var(--head)}
.pe-f{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.pe-f .pe-name{grid-column:1/-1}
.pe-f .pe-name input{font-size:1.05rem;font-weight:700;padding:11px 12px}
.prow-ed input{width:100%;padding:9px 11px;border-radius:11px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:0;box-sizing:border-box}
.prow-ed input:focus{outline:0;border-color:var(--blue)}
.ph-up{width:52px;height:52px;border-radius:50%;border:2px dashed var(--muted);background:var(--paper) center/cover;cursor:pointer;font-size:.68rem;color:var(--muted);display:grid;place-items:center;line-height:1.1;text-align:center}
.xbtn{border:0;background:transparent;color:var(--live);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.addbtn{border:1.5px dashed var(--blue);color:var(--blue);background:transparent;border-radius:14px;padding:10px;font-weight:700;cursor:pointer}
.ed-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:18px}
.ed-actions .r{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--bg2);color:var(--head)}
.btn.pri{background:linear-gradient(135deg,var(--flame),var(--mag));color:#fff}
.btn.del{background:transparent;color:var(--live);border:1.5px solid var(--live)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.alist{display:grid;gap:8px}
.aitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--bg2)}
.aitem .t{flex:1;min-width:0}
.aitem b{color:var(--head)}
.aitem small{display:block;color:var(--muted)}
.edbtn{display:none}
body.admin .edbtn{display:inline-flex}
.edbtn{align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.78rem;cursor:pointer;background:var(--live);color:#fff}

/* pin pad */
.pin-sheet{width:min(360px,100%);padding:26px 24px;text-align:center}
.pin-sheet h3{font-family:var(--f-disp);font-weight:800;color:var(--head);font-size:1.4rem}
.pin-sheet p{color:var(--muted);margin:4px 0 14px;font-size:.9rem}
.dots{display:flex;gap:12px;justify-content:center;margin:8px 0 18px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--head);transition:.2s}
.dots i.f{background:var(--flame);border-color:var(--flame);transform:scale(1.15)}
.dots.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:18px;border:1px solid var(--line);background:var(--bg2);font-family:var(--f-num);font-weight:800;font-size:1.5rem;color:var(--head);cursor:pointer;transition:.15s}
.pad button:active{transform:scale(.94);background:color-mix(in srgb,var(--sun) 35%,var(--bg2))}
.pinmsg{min-height:1.4em;color:var(--live);font-size:.86rem;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;background:#141c4a;color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:rise .4s both;max-width:calc(100% - 32px);text-align:center}
.confetti{position:fixed;z-index:150;width:9px;height:13px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(760deg)}}
.pre{opacity:0;transform:translateY(34px)}
.reveal{transition:opacity .9s,transform .9s cubic-bezier(.2,.9,.25,1.1)}

@media (max-width:1000px){
  .hero{grid-template-columns:1fr}
  .hero-text{text-align:center}.hero .lede{margin-inline:auto}.datebig,.countdown,.cta-row{justify-content:center}
  .dash{grid-template-columns:repeat(2,1fr)}
  .dash2,.vfind{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(4,1fr)}
  .fg{grid-template-columns:1fr}
}
@media (max-width:640px){
  .nav{display:none}
  .topbar .mobile-adm{display:inline-flex}
  .days{grid-template-columns:repeat(2,1fr)}
  .day{min-height:140px}
  .card{grid-template-columns:auto 1fr;gap:12px;padding:14px}
  .side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .emo{width:52px;height:52px;font-size:1.6rem;border-radius:16px}
  .timeline{padding-left:34px}.timeline .track{left:6px;width:12px}.ev .node{left:-33px}
  .cd{width:66px}.cd .tile{height:62px;font-size:2rem}
  .stat .n{font-size:2.5rem}
  .m-hero,.m-body{padding-left:18px;padding-right:18px}
  .form .row2,.form .row3{grid-template-columns:1fr}
  .prow-ed{grid-template-columns:1fr auto}
  .pe-ph{grid-column:1/2;grid-row:1;width:auto;justify-items:start;grid-template-columns:auto 1fr;align-items:center}
  .pe-f{grid-column:1/-1;grid-template-columns:1fr}
  .prow-ed .xbtn{grid-column:2;grid-row:1}
  .search input{width:140px}
}
.mobile-adm{display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- cropper ---------- */
.crop-sheet{width:min(480px,100%);padding:24px 20px 18px;text-align:center}
.crop-sheet h3{font-family:var(--f-disp);font-weight:800;color:var(--head);font-size:1.35rem;margin:0}
.crop-sheet p{color:var(--muted);margin:4px 0 14px;font-size:.88rem}
.crop-stage{width:100%;display:grid;place-items:center}
.crop-stage canvas{max-width:100%;border-radius:18px;touch-action:none;cursor:grab;box-shadow:0 18px 40px -18px rgba(0,0,0,.5)}
.crop-stage canvas:active{cursor:grabbing}
.crop-tools{display:flex;align-items:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap;justify-content:center}
.crop-tools input{flex:1;min-width:120px;accent-color:var(--flame)}
.crop-tools button{border:1px solid var(--line);background:var(--bg2);color:var(--head);border-radius:999px;min-width:40px;height:38px;padding:0 12px;font-weight:800;cursor:pointer}
.abtn.warn{background:#ffcf6b;color:#141c4a;text-decoration:none}
#pubmsg a.lnk{display:inline-block;margin-top:4px}
body.admin .toast{bottom:auto;top:calc(84px + env(safe-area-inset-top,0px))}
@media (max-width:640px){.adminbar .ab{gap:6px;padding:8px}.adminbar .abtn{padding:8px 11px;font-size:.78rem}}

/* ---------- medical duty ---------- */
.med{grid-template-columns:repeat(auto-fill,minmax(min(100%,540px),1fr))}
.mi-card{position:relative;overflow:hidden;border-radius:28px;padding:22px;margin-bottom:14px;color:#fff;
  background:radial-gradient(circle at 92% -20%,rgba(255,255,255,.28),transparent 42%),linear-gradient(135deg,#1f7a4d,#2e8b57 45%,#0e9aab);box-shadow:0 30px 60px -30px rgba(14,110,80,.7)}
.mi-card::after{content:"🌿";position:absolute;right:-10px;bottom:-34px;font-size:9rem;opacity:.12;transform:rotate(-18deg);animation:sway 7s ease-in-out infinite;pointer-events:none}
.mi-top{display:flex;gap:14px;align-items:center}
.mi-badge{width:56px;height:56px;flex:none;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);animation:beat 3.4s ease-in-out infinite}
.mi-h{min-width:0}
.mi-h small{display:block;font-size:.76rem;font-weight:700;letter-spacing:.04em;opacity:.85}
.mi-h b{display:block;font-family:var(--f-disp);font-weight:800;font-size:clamp(1.25rem,3vw,1.6rem);line-height:1.15}
.mi-h span{display:block;font-size:.8rem;opacity:.85;margin-top:2px}
.mi-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;position:relative;z-index:1}
.mi-p{flex:1;min-width:200px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mi-p small{display:block;font-size:.74rem;opacity:.85}
.mi-p b{font-family:var(--f-disp);font-size:1.1rem}
.mi-p .pp{font-family:var(--f-num);font-weight:700;font-size:1.05rem;user-select:all}
.mi-p .copy{background:rgba(255,255,255,.9);color:#1f5c3d;border:0}
.mi-ph{margin:12px 0 0;font-size:.86rem;opacity:.92;position:relative;z-index:1}
.mi-q{margin-top:14px;position:relative;z-index:1;background:#fff;color:#17204a;border:0;padding:10px 14px;box-shadow:0 12px 26px -14px rgba(0,0,0,.5)}
.mi-q input{width:100%;max-width:none;color:#17204a}
.mi-res{display:grid;gap:6px;margin-top:8px;position:relative;z-index:1;max-height:340px;overflow:auto}
.mi-res .mnone{color:#fff;opacity:.9;padding:6px 4px}
.mi-hit{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-radius:14px;padding:8px 12px;background:rgba(255,255,255,.95);color:#17204a;cursor:pointer;animation:rise .4s both;border-left:5px solid var(--c)}
.mi-d{min-width:46px;text-align:center;font-size:.7rem;color:#59618a;line-height:1.1}
.mi-d b{display:block;font-family:var(--f-num);font-size:1.3rem;color:#1d2a6b}
.mi-x{min-width:0}.mi-x b{display:block}.mi-x small{color:#59618a;font-size:.78rem}

.mc-duty{padding:12px 14px 4px}
.duty{display:grid;gap:10px}
.dz-conv{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:14px;background:linear-gradient(90deg,color-mix(in srgb,#2e8b57 16%,var(--paper)),var(--paper));border:1px solid color-mix(in srgb,#2e8b57 30%,var(--line))}
.dz-conv>span{font-size:1.3rem}
.dz-conv small{display:block;font-size:.72rem;color:var(--muted);font-weight:700}
.dz-conv b{color:var(--head);font-family:var(--f-disp);font-size:1.02rem}
.dz-tabs{display:flex;gap:6px;overflow-x:auto;padding:9px 6px 8px 2px;scrollbar-width:thin}
.dz-tab{position:relative;flex:none;min-width:58px;border:1px solid var(--line);background:var(--bg2);color:var(--head);border-radius:16px;padding:6px 8px 7px;cursor:pointer;line-height:1.05;text-align:center;transition:transform .3s cubic-bezier(.2,.9,.25,1.4),box-shadow .3s}
.dz-tab b{display:block;font-family:var(--f-num);font-weight:800;font-size:1.35rem}
.dz-tab small{font-size:.68rem;color:var(--muted)}
.dz-tab i{position:absolute;top:-6px;right:-5px;font-style:normal;font-size:.62rem;font-weight:800;background:var(--paper);color:var(--head);border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.dz-tab:hover{transform:translateY(-2px)}
.dz-tab.on{background:var(--g);color:#fff;border-color:transparent;transform:translateY(-3px) scale(1.05);box-shadow:0 12px 22px -10px rgba(0,0,0,.45)}
.dz-tab.on small{color:rgba(255,255,255,.88)}
.dz-panel{display:grid;gap:10px}
.dz-blk{border-radius:18px;background:var(--paper);border:1px solid var(--line);overflow:hidden;animation:dzIn .55s cubic-bezier(.2,.9,.25,1.15) both;box-shadow:0 14px 28px -22px rgba(23,32,74,.6)}
@keyframes dzIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.dz-bh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 92%,#000) ,color-mix(in srgb,var(--c) 70%,#fff 0%));color:#fff;position:relative}
.dz-bh::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,.07) 26px 28px);pointer-events:none}
.dz-ic{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:rgba(255,255,255,.2)}
.dz-bt{min-width:0;position:relative;z-index:1}
.dz-kind{display:inline-block;font-size:.64rem;font-weight:800;letter-spacing:.05em;background:rgba(255,255,255,.22);padding:1px 8px;border-radius:999px}
.dz-bt b{display:block;font-family:var(--f-disp);font-weight:800;font-size:1.05rem;line-height:1.2;margin-top:2px}
.dz-bt small{display:block;font-size:.76rem;opacity:.9}
.dz-cols{display:grid;grid-template-columns:1fr 1fr;gap:0}
.dz-cols.one{grid-template-columns:1fr}
.dz-col{padding:10px 12px 12px;min-width:0}
.dz-col+.dz-col{border-left:1px dashed var(--line)}
.dz-col h6{margin:0 0 6px;font-size:.72rem;font-weight:800;letter-spacing:.04em;color:color-mix(in srgb,var(--c) 75%,var(--head))}
.dz-p{display:flex;gap:9px;align-items:center;padding:5px 0;animation:rise .45s both}
.dz-av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.82rem;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 52%),hsl(calc(var(--h) + 40) 62% 40%))}
.dz-av.dr{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px color-mix(in srgb,var(--c) 70%,transparent)}
.dz-t{min-width:0;flex:1}
.dz-t b{display:block;color:var(--head);font-size:.9rem;line-height:1.2}
.dz-t small{display:block;color:var(--muted);font-size:.74rem;line-height:1.25}
.dz-note{flex:none;font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--sun) 35%,var(--paper));color:var(--head)}
.dz-more{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.76rem;color:var(--muted);font-weight:700}
.dz-more span{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:999px;background:var(--bg2);color:var(--head);font-family:var(--f-num);font-size:.95rem;border:1px dashed var(--muted)}
.dz-sub{margin:12px 0 4px;font-size:.72rem;letter-spacing:.05em;color:var(--muted);font-weight:800}
.m-body .duty{margin-top:2px}
.dz-help{font-size:.8rem;color:var(--muted);margin:-4px 0 4px}
.dz-help code{background:var(--bg2);padding:1px 6px;border-radius:6px}
.dz-ed{border-radius:16px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.dz-ed summary{display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.dz-ed summary::-webkit-details-marker{display:none}
.dz-ed summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .3s}
.dz-ed[open] summary::after{transform:rotate(180deg)}
.dz-ed-d{font-family:var(--f-num);font-weight:800;font-size:1.2rem;color:var(--head);min-width:64px}
.dz-ed-d small{font-family:var(--f-body);font-size:.7rem;color:var(--muted);font-weight:600}
.dz-ed-t{flex:1;min-width:0;font-weight:700;color:var(--head);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz-ed-n{font-size:.74rem;color:var(--muted);flex:none}
.dz-ed-b{display:grid;gap:10px;padding:4px 14px 14px}
.dz-ed textarea{font-size:.84rem;line-height:1.5}
@media (max-width:640px){.dz-cols{grid-template-columns:1fr}.dz-col+.dz-col{border-left:0;border-top:1px dashed var(--line)}.mc-duty{padding:10px 10px 2px}}

/* ---------- prepared-by band ---------- */
#prep{display:flex;justify-content:center;margin-bottom:12px}
.prep{position:relative;display:inline-flex;align-items:center;gap:12px;max-width:100%;padding:7px 18px 7px 8px;border-radius:999px;text-decoration:none;color:#fff;overflow:hidden;
  background:linear-gradient(110deg,#0f5132,#1f7a4d 35%,#14915f 60%,#0e6b6b);box-shadow:0 16px 34px -18px rgba(15,81,50,.75),inset 0 0 0 1px rgba(255,255,255,.18);animation:prepIn .9s cubic-bezier(.2,.9,.25,1.2) both}
.prep::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%) 0 0/260% 100%;animation:shine 4.5s 1s ease-in-out infinite;pointer-events:none}
@keyframes prepIn{from{opacity:0;transform:translateY(-16px) scale(.94)}to{opacity:1;transform:none}}
.prep-l{flex:none;font-size:.7rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px;order:0}
.prep-logo{position:relative;flex:none;width:44px;height:44px;border-radius:50%;padding:3px;background:conic-gradient(#ffd166,#fff,#7ee2a8,#ffd166);animation:spin 8s linear infinite}
.prep-logo img{display:block;width:100%;height:100%;border-radius:50%;background:#fff;animation:spin 8s linear infinite reverse}
.prep-n{min-width:0;font-family:var(--f-disp);font-weight:800;font-size:clamp(.92rem,2.2vw,1.12rem);line-height:1.2;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.prep-go{flex:none;font-weight:800;opacity:.85}
a.prep:hover{transform:translateY(-1px)}
@media (max-width:640px){.prep{gap:8px;padding-right:12px;border-radius:22px}.prep-l{font-size:.6rem;padding:3px 8px}.prep-logo{width:38px;height:38px}}

/* ---------- hero video ---------- */
.hero-left{min-width:0;display:grid;gap:6px}
.vidcard{position:relative;width:min(440px,100%);margin:0 auto;border-radius:26px;padding:6px;
  background:conic-gradient(from var(--va,0deg),var(--flame),var(--sun),var(--lime),var(--teal),var(--blue),var(--mag),var(--flame));

.vidcard video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:21px;background:#0b0f27}

.vid-ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 30px,rgba(255,255,255,.06) 30px 32px)}

.vid-t{position:relative;min-width:0}

    el.style.transform='perspective(1000px) rotateY('+(x*max)+'deg) rotateX('+(-y*max)+'deg) translateZ('+lift+'px)';el.style.setProperty('--mx',(x+.5)*100+'%');el.style.setProperty('--my',(y+.5)*100+'%')});
  el.addEventListener('pointerleave',function(){el.style.transform=''})}
function toast(t){var o=$('.toast');if(o)o.remove();var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function copyText(t,btn){var done=function(){if(btn){var o=btn.textContent;btn.textContent='✓';setTimeout(function(){btn.textContent=o},1400)}};
  try{navigator.clipboard.writeText(t).then(done,function(){toast(t)})}catch(e){toast(t)}}

function tick(){
  var now=new Date(),target=null,label;

}

function dutyDays(v){var d=dutyOf(v),o={};if(d)d.blocks.forEach(function(b){o[b.d]=1});return Object.keys(o).sort()}
function pname(p){return (p.n||'').trim()}
function medNames(v){var o={};(v.medical||[]).forEach(function(p){if(p.name)o[p.name.trim().toLowerCase()]=1});var d=dutyOf(v);if(d)d.blocks.forEach(function(b){(b.doc||[]).concat(b.st||[]).forEach(function(p){if(pname(p))o[pname(p).toLowerCase()]=1})});return o}
function medCount(v){return Object.keys(medNames(v)).length}
function hue(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return h}
function dzInit(n){var t=n.replace(/^(ഡോ\.?|Dr\.?)\s*/i,'').trim();var ch=Array.from(t)[0]||'?';return ch.toUpperCase()}
function blockColor(v,b){if(b.k==='camp')return CAMP_C;if(b.c)return col(b.c);var en=(b.en||'').toLowerCase();var e=S.events.filter(function(e){return e.venue===v.id&&en&&en.indexOf((e.en||'@').toLowerCase().replace(/ –.*$/,''))===0})[0];return e?col(e.color):col(v.color)}
function dzPeople(list,extra,isDoc){
  var h=(list||[]).map(function(p,i){var n=pname(p),dr=isDoc||/^(ഡോ|dr)/i.test(n);
    return '<div class="dz-p" style="animation-delay:'+(.05+i*.04).toFixed(2)+'s"><span class="dz-av'+(dr?' dr':'')+'" style="--h:'+hue(n)+'">'+esc(dzInit(n))+'</span><div class="dz-t"><b>'+esc(n)+'</b><small>'+esc([p.r,p.i].filter(Boolean).join(' · '))+'</small></div>'+(p.note?'<span class="dz-note">'+esc(p.note)+'</span>':'')+'</div>'}).join('');
  if(extra>0)h+='<div class="dz-more"><span>+'+extra+'</span> പേർ കൂടി</div>';
  return h}
function dzBlock(v,b,i){var c=blockColor(v,b),camp=b.k==='camp',sx=(b.st||[]).length||b.sx>0;
  return '<div class="dz-blk'+(camp?' camp':'')+'" style="--c:'+c+';animation-delay:'+(i*.08).toFixed(2)+'s"><div class="dz-bh"><span class="dz-ic">'+(camp?'🌿':esc(b.ic||'🏅'))+'</span><div class="dz-bt"><span class="dz-kind">'+(camp?'ആയുർവേദ മെഡിക്കൽ ക്യാമ്പ്':'സ്പോർട്സ് ആയുർവേദ')+'</span><b>'+esc(camp?b.t.replace(/^ആയുർവേദ മെഡിക്കൽ ക്യാമ്പ് · /,''):b.t)+'</b>'+(b.en||b.tm?'<small>'+esc([b.en,b.tm?'🕒 '+b.tm:''].filter(Boolean).join(' · '))+'</small>':'')+'</div></div>'+
    '<div class="dz-cols'+(sx?'':' one')+'"><div class="dz-col"><h6>👨‍⚕️ '+(camp?'മെഡിക്കൽ ഓഫീസർമാർ':'ഡോക്ടർമാർ')+'</h6>'+dzPeople(b.doc,b.dx,true)+'</div>'+(sx?'<div class="dz-col"><h6>🤝 '+(camp?'സ്റ്റാഫ്':'സപ്പോർട്ടിംഗ് സ്റ്റാഫ്')+'</h6>'+dzPeople(b.st,b.sx,false)+'</div>':'')+'</div></div>'}
function dzPanel(v,day){var d=dutyOf(v);var bl=d.blocks.filter(function(b){return b.d===day});
  return bl.length?bl.map(function(b,i){return dzBlock(v,b,i)}).join(''):'<div class="mnone">ഈ ദിവസം ഡ്യൂട്ടി ഇല്ല.</div>'}
function pickDay(v,pref){var ds=dutyDays(v);if(pref&&ds.indexOf(pref)>=0)return pref;var n=new Date();for(var i=0;i<ds.length;i++){if(n>=ist(ds[i],'00:00')&&n<=ist(ds[i],'23:59'))return ds[i]}return ds[0]}
function dutyHTML(v,pref){var d=dutyOf(v);if(!d)return '';var ds=dutyDays(v),day=pickDay(v,pref);
  return '<div class="duty" data-v="'+esc(v.id)+'">'+(d.conv?'<div class="dz-conv"><span>🩺</span><div><small>വേദിയിലെ മെഡിക്കൽ കൺവീനർ</small><b>'+esc(d.conv)+'</b></div></div>':'')+
    '<div class="dz-tabs" role="tablist">'+ds.map(function(x){var n=d.blocks.filter(function(b){return b.d===x}).length,i=DAYS.indexOf(x);
      return '<button type="button" role="tab" class="dz-tab'+(x===day?' on':'')+'" data-d="'+x+'" style="--g:'+dgrad(i<0?0:i)+'"><b>'+dnum(x)+'</b><small>'+wd(x)+'</small><i>'+n+'</i></button>'}).join('')+'</div>'+
    '<div class="dz-panel">'+dzPanel(v,day)+'</div></div>'}
function medBlock(v,pref){var d=dutyOf(v),m=v.medical||[];
  if(!d&&!m.length)return '<div class="mnone" style="padding:0">മെഡിക്കൽ കമ്മിറ്റിയുടെ അലോട്ട്മെന്റ് ഉടൻ ചേർക്കും.</div>';
  return dutyHTML(v,pref)+(m.length?(d?'<h6 class="dz-sub">മറ്റ് മെഡിക്കൽ ടീം</h6>':'')+medList(m,v.color):'')}

function findDuty(q){q=q.trim().toLowerCase();if(q.length<2)return [];var r=[];
  S.venues.forEach(function(v){var d=dutyOf(v);(v.medical||[]).forEach(function(p){if((p.name||'').toLowerCase().indexOf(q)>=0)r.push({v:v,n:p.name,t:p.role||'മെഡിക്കൽ ടീം',d:p.days||''})});
    if(d){if(d.conv&&d.conv.toLowerCase().indexOf(q)>=0)r.push({v:v,n:d.conv,t:'വേദിയിലെ മെഡിക്കൽ കൺവീനർ',d:''});
      d.blocks.forEach(function(b){(b.doc||[]).concat(b.st||[]).forEach(function(p){if(pname(p).toLowerCase().indexOf(q)>=0)r.push({v:v,n:pname(p),t:(b.k==='camp'?b.t:'സ്പോർട്സ് ആയുർവേദ · '+b.t)+(b.tm?' · '+b.tm:''),d:b.d,dd:b.d})})})}});
  return r.sort(function(a,b){return (a.d||'').localeCompare(b.d||'')})}

    (s.medPharm?'<p class="mi-ph">💊 '+esc(s.medPharm)+'</p>':'')+
    '<label class="search mi-q"><span aria-hidden="true">🔎</span><input id="mq" type="search" placeholder="നിങ്ങളുടെ പേര് തിരയൂ — ഡ്യൂട്ടി എവിടെ, എപ്പോൾ" aria-label="ഡ്യൂട്ടി തിരയുക"></label><div id="mqr" class="mi-res"></div></div>':'';

function flipTo(fn){var sh=$('#modal .sheet');sh.style.transition='transform .28s,opacity .28s';sh.style.transform='rotateY(-24deg) scale(.95)';sh.style.opacity='0';
  setTimeout(function(){fn();sh.scrollTop=0;sh.style.transform='rotateY(24deg) scale(.95)';requestAnimationFrame(function(){sh.style.transition='';sh.style.transform='';sh.style.opacity=''})},280)}
function shade(hex,p){var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;var f=function(c){return Math.max(0,Math.min(255,Math.round(p<0?c*(1+p):c+(255-c)*p)))};return 'rgb('+f(r)+','+f(g)+','+f(b)+')'}

function parseLines(t){return t.split(/\n/).map(function(l){var f=l.split('|').map(function(x){return x.trim()});if(!f[0])return null;var p={n:f[0]};if(f[1])p.r=f[1];if(f[2])p.i=f[2];if(f[3])p.note=f[3];return p}).filter(Boolean)}
function linesOf(L){return (L||[]).map(function(p){var a=[p.n||'',p.r||'',p.i||'',p.note||''];while(a.length>1&&!a[a.length-1])a.pop();return a.join(' | ')}).join('\n')}

function doPublish(){
  var btn=$('#doPub'),msg=$('#pubmsg');btn.disabled=true;btn.textContent='പ്രസിദ്ധീകരിക്കുന്നു…';
  var fail=function(t){msg.textContent=t;btn.disabled=false;btn.textContent='🚀 പ്രസിദ്ധീകരിക്കുക'};
  if(!artifactNS){if(artifactReady){fail('');msg.innerHTML='<b>ഈ രീതിയിൽ തുറന്ന പേജിൽ നിന്ന് സേവ് ചെയ്യാനാവില്ല.</b><br>'+OPEN_HINT+'<br><br>'+openLink()+'<br><br>ഇവിടെ വരുത്തിയ മാറ്റങ്ങൾ നഷ്ടപ്പെടില്ല: അഡ്മിൻ പാനലിലെ "ഡ്രാഫ്റ്റ് കൈമാറ്റം" വഴി കോപ്പി ചെയ്ത് അവിടെ പേസ്റ്റ് ചെയ്യാം.'}else fail('പ്രസിദ്ധീകരണ സംവിധാനം ലോഡ് ചെയ്യുന്നു. കുറച്ച് സെക്കൻഡ് കഴിഞ്ഞ് വീണ്ടും ശ്രമിക്കുക.');return}
  var next=clone(S);next.settings.updated=new Date().toISOString();
  var html=buildHTML(next);
  ss('km-admin','1');
  artifactNS.publish(html).then(function(){ls('km-draft',null);msg.style.color='var(--ok)';msg.textContent='✓ പ്രസിദ്ധീകരിച്ചു! പേജ് പുതുക്കുന്നു…';burst(btn)},function(err){
    var c=err&&err.code;
    if(c==='conflict')fail('മറ്റൊരാൾ ഇതിനിടെ പ്രസിദ്ധീകരിച്ചു. പേജ് ഏറ്റവും പുതിയ പതിപ്പിലേക്ക് പുതുക്കുന്നു; നിങ്ങളുടെ മാറ്റങ്ങൾ വീണ്ടും ചേർക്കേണ്ടി വന്നേക്കാം.');
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='capability_removed'||c==='not_declared'){fail('');msg.innerHTML='<b>ഈ അക്കൗണ്ടിന് പേജ് മാറ്റാൻ അനുമതിയില്ല.</b><br>'+OPEN_HINT+'<br><br>'+openLink()}
    else if(c==='too_large')fail('പേജിന്റെ വലിപ്പം കൂടുതലാണ്. ചില ഫോട്ടോകൾ നീക്കി വീണ്ടും ശ്രമിക്കുക.');
    else if(c==='rate_limited')fail('വളരെ വേഗത്തിൽ പ്രസിദ്ധീകരിക്കുന്നു. ഒരു മിനിറ്റ് കഴിഞ്ഞ് ശ്രമിക്കുക.');
    else fail('പ്രസിദ്ധീകരിക്കാനായില്ല (കണക്ഷൻ പ്രശ്നം). അൽപസമയത്തിന് ശേഷം വീണ്ടും ശ്രമിക്കുക.');
  });
}

/* ---------- photo picking + cropper ---------- */
var PERSON_CROP={aspect:1,out:300,round:true,q:.82},VENUE_CROP={aspect:16/9,out:960,round:false,q:.74};
var photoCb=null,photoOpt=PERSON_CROP;
function pickPhoto(cb,opt){photoCb=cb;photoOpt=opt||PERSON_CROP;var f=$('#fileIn');f.value='';f.click()}
function onFile(e){var f=e.target.files[0];if(!f||!photoCb)return;var u=URL.createObjectURL(f),cb=photoCb;photoCb=null;cropImage(u,photoOpt,cb,function(){URL.revokeObjectURL(u)})}
var C=null;
function cropImage(src,opt,cb,after){var im=new Image();
  im.onload=function(){if(after)after();C={src:im,o:opt,cb:cb,z:1,ox:0,oy:0};openM('cropm');requestAnimationFrame(cropSetup)};
  im.onerror=function(){if(after)after();toast('ഈ ഫയൽ ഫോട്ടോയായി തുറക്കാനായില്ല')};im.src=src}
function cropSetup(){var st=$('#cropStage'),cv=$('#cropCv'),dpr=Math.min(window.devicePixelRatio||1,2);
  var W=Math.min(420,st.clientWidth||320),M=Math.round(W*.08),fw=W-2*M,fh=fw/C.o.aspect,H=fh+2*M;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
  C.W=W;C.H=H;C.M=M;C.fw=fw;C.fh=fh;C.dpr=dpr;C.base=Math.max(fw/C.src.width,fh/C.src.height);C.z=1;C.ox=0;C.oy=0;$('#cropZoom').value=1;cropDraw()}
function cropClamp(){var s=C.base*C.z,mx=Math.max(0,(C.src.width*s-C.fw)/2),my=Math.max(0,(C.src.height*s-C.fh)/2);C.ox=Math.max(-mx,Math.min(mx,C.ox));C.oy=Math.max(-my,Math.min(my,C.oy))}
function frame(x,M,fw,fh,round){x.beginPath();if(round)x.arc(M+fw/2,M+fh/2,fw/2,0,Math.PI*2);else{var r=14;x.moveTo(M+r,M);x.arcTo(M+fw,M,M+fw,M+fh,r);x.arcTo(M+fw,M+fh,M,M+fh,r);x.arcTo(M,M+fh,M,M,r);x.arcTo(M,M,M+fw,M,r);x.closePath()}}
function cropDraw(){if(!C)return;cropClamp();var cv=$('#cropCv'),x=cv.getContext('2d'),s=C.base*C.z,iw=C.src.width*s,ih=C.src.height*s;
  x.setTransform(C.dpr,0,0,C.dpr,0,0);x.fillStyle='#0b1030';x.fillRect(0,0,C.W,C.H);
  x.drawImage(C.src,C.M+C.fw/2+C.ox-iw/2,C.M+C.fh/2+C.oy-ih/2,iw,ih);
  x.save();x.beginPath();x.rect(0,0,C.W,C.H);frame(x,C.M,C.fw,C.fh,C.o.round);x.fillStyle='rgba(8,12,40,.62)';x.fill('evenodd');x.restore();
  frame(x,C.M,C.fw,C.fh,C.o.round);x.lineWidth=2.5;x.strokeStyle='#fff';x.stroke();
  x.globalAlpha=.35;x.lineWidth=1;x.beginPath();for(var k=1;k<3;k++){x.moveTo(C.M+C.fw*k/3,C.M);x.lineTo(C.M+C.fw*k/3,C.M+C.fh);x.moveTo(C.M,C.M+C.fh*k/3);x.lineTo(C.M+C.fw,C.M+C.fh*k/3)}x.stroke();x.globalAlpha=1}
function cropZoomTo(z){C.z=Math.max(1,Math.min(5,z));$('#cropZoom').value=C.z;cropDraw()}
function cropRotate(){var c=document.createElement('canvas');c.width=C.src.height;c.height=C.src.width;var x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(C.src,0,0);C.src=c;cropSetup()}
function cropDone(){var o=C.o,ow=o.out,oh=Math.round(ow/o.aspect),k=ow/C.fw,s=C.base*C.z*k,c=document.createElement('canvas');c.width=ow;c.height=oh;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,ow,oh);x.imageSmoothingQuality='high';x.drawImage(C.src,ow/2+C.ox*k-C.src.width*s/2,oh/2+C.oy*k-C.src.height*s/2,C.src.width*s,C.src.height*s);
  var url=c.toDataURL('image/jpeg',o.q),cb=C.cb;C=null;closeM('cropm');cb(url)}
function cropBind(){var cv=$('#cropCv'),pts={},pd=0;
  cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]={x:e.clientX,y:e.clientY};pd=0});
  cv.addEventListener('pointermove',function(e){if(!C||!pts[e.pointerId])return;var ids=Object.keys(pts),p=pts[e.pointerId];
    if(ids.length===1){C.ox+=e.clientX-p.x;C.oy+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;cropDraw()}
    else{p.x=e.clientX;p.y=e.clientY;var a=pts[ids[0]],b=pts[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(pd)cropZoomTo(C.z*d/pd);pd=d}});
  var up=function(e){delete pts[e.pointerId];pd=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){if(!C)return;e.preventDefault();cropZoomTo(C.z*Math.exp(-e.deltaY*.0015))},{passive:false});
  $('#cropZoom').addEventListener('input',function(){if(C)cropZoomTo(+this.value)});
  $('#cropIn').onclick=function(){if(C)cropZoomTo(C.z*1.15)};$('#cropOut').onclick=function(){if(C)cropZoomTo(C.z/1.15)};
  $('#cropRot').onclick=function(){if(C)cropRotate()};$('#cropOk').onclick=function(){if(C)cropDone()};
  addEventListener('resize',function(){if(C&&$('#cropm').classList.contains('open'))cropSetup()})}

/* ---------- effects ---------- */
function burst(el){if(reduce||!el)return;var r=el.getBoundingClientRect(),cols=['#f26522','#f5a70d','#5aa62c','#0e9aab','#2c5bd3','#c2185b'];
  for(var i=0;i<34;i++){var c=document.createElement('div');c.className='confetti';c.style.left=(r.left+Math.random()*r.width)+'px';c.style.top=r.top+'px';c.style.background=cols[i%6];c.style.borderRadius=Math.random()>.5?'50%':'3px';
    c.style.setProperty('--x',(Math.random()*220-110)+'px');c.style.animationDuration=(1.6+Math.random()*1.6)+'s';document.body.appendChild(c);(function(c){setTimeout(function(){c.remove()},3400)})(c)}}
function sparks(){var cv=$('#km-spark');if(!cv||reduce)return;var cx=cv.getContext('2d'),pts=[],dpr=Math.min(window.devicePixelRatio||1,2);
  var cols=['#f26522','#f5a70d','#5aa62c','#0e9aab','#2c5bd3','#c2185b'];
  function size(){cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    pts=Array.from({length:Math.min(60,Math.floor(innerWidth/18))},function(){return {x:Math.random()*innerWidth,y:Math.random()*innerHeight,l:6+Math.random()*12,v:.2+Math.random()*.45,p:Math.random()*6.28,c:cols[Math.floor(Math.random()*6)]}})}
  function draw(t){cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
    pts.forEach(function(s){s.y-=s.v;s.x+=Math.sin(t/1800+s.p)*.3;if(s.y<-20){s.y=innerHeight+20;s.x=Math.random()*innerWidth}
      cx.globalAlpha=.18+.35*Math.abs(Math.sin(t/900+s.p));cx.strokeStyle=s.c;cx.lineWidth=2.4;cx.lineCap='round';cx.beginPath();cx.moveTo(s.x,s.y);cx.quadraticCurveTo(s.x+Math.sin(t/600+s.p)*6,s.y+s.l/2,s.x,s.y+s.l);cx.stroke()});
    requestAnimationFrame(draw)}
  addEventListener('resize',size);size();requestAnimationFrame(draw)}
function reveals(){if(!('IntersectionObserver' in window))return;var vh=innerHeight;
  var io=new IntersectionObserver(function(es){es.forEach(function(en){if(!en.isIntersecting)return;var el=en.target;el.classList.remove('pre');
    if(el.id==='calp')el.classList.add('cal-in');$$('[data-w]',el).forEach(function(b){b.style.width=b.dataset.w+'%'});io.unobserve(el)})},{threshold:.12});
  $$('.reveal').forEach(function(r,i){if(r.getBoundingClientRect().top>vh*.92){r.classList.add('pre');r.style.transitionDelay=(r.classList.contains('stat')?(i%4)*.1:0)+'s';io.observe(r)}else{if(r.id==='calp')r.classList.add('cal-in')}});
  var cal=$('#calp');if(cal&&!cal.classList.contains('pre'))cal.classList.add('cal-in');
}
